# Оверлей для разработки. Применять явно:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Здесь живут подстановки внешних систем, доступа к которым на стенде нет,
# и публикация портов для локальных тестов. В продуктивную конфигурацию
# этот файл не идёт.
#
# Порт БД нестандартный: 5432 на хосте может быть занят локальным PostgreSQL
# или зарезервирован Windows (Hyper-V port exclusion range).

services:
  db:
    ports:
      - "127.0.0.1:55432:5432"

  # Кнопки быстрого входа на экране авторизации: показать конвейер под двумя
  # ролями за один клик, не диктуя пароли со сцены. Учётки задаются только
  # здесь — продуктивная сборка идёт без этих аргументов, и кнопок в ней нет.
  frontend:
    build:
      args:
        NUXT_PUBLIC_DEMO_USER: "duty:Пароль-для-стенда-12"
        NUXT_PUBLIC_DEMO_ADMIN: "admin:Пароль-для-стенда-12"

  # Подстановка каталога: структура групп воспроизводит боевую AD.
  # Тесты идут против него, а не против моков библиотеки — иначе проверялась
  # бы наша фантазия о протоколе, а не работа с каталогом.
  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Apollo Test
      LDAP_DOMAIN: apollo.test
      LDAP_ADMIN_PASSWORD: ldap-admin-pass
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports:
      - "127.0.0.1:1389:389"
    networks: [internal]

  # Перехватчик почты: вместо TrueConf и релея заказчика. Письма не уходят
  # наружу, а оседают в веб-интерфейсе http://localhost:8025.
  # Бэкенд ходит на mailpit:1025 без TLS (SMTP_USE_TLS=false).
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

  # Мок-сервер TrueConf закомментирован: боевая ВМ TrueConf недоступна, канал
  # заменён email через mailpit. TRUECONF_BASE_URL в .env.example пуст, поэтому
  # уведомления этого канала уходят в failed, остальной конвейер не страдает.
  # Раскомментировать, если мок понадобится для тестов адаптера.
  # trueconf:
  #   build:
  #     context: ..
  #     dockerfile: deploy/mocks/trueconf/Dockerfile
  #   environment:
  #     MOCK_USERNAME: apollo-bot
  #     MOCK_PASSWORD: apollo-bot-pass
  #   ports:
  #     - "127.0.0.1:18080:8080"
  #   networks: [internal]

  # Подстановка локальной модели, пока ВМ с Qwen не готова. Контракт тот же
  # (OpenAI-совместимый), переключение — смена LLM_BASE_URL и LLM_MODEL.
  llm-mock:
    build:
      context: ..
      dockerfile: deploy/mocks/llm/Dockerfile
    environment:
      MOCK_MODEL: qwen2.5-7b-instruct
    ports:
      - "127.0.0.1:18081:8080"
    networks: [internal]

  # Эмулятор ВМ №1 и №2 (Zabbix, SolarWinds). На стендовых машинах по замыслу
  # стоит генератор событий (AGENTS.md §3) — здесь он в контейнере, потому что
  # SSH ни на одну из ВМ не проходит (docs/integration-runbook.md §4). Шлёт те же
  # вебхуки, что боевые системы: переключение на настоящий источник = docker
  # compose stop simulator.
  #
  # Профиль demo: обычный `up` его НЕ поднимает, нужен явный флаг —
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
  #     --profile demo up -d simulator
  #
  # Токены выдаются в реестре источников и кладутся в ../.env:
  #   docker compose exec backend python -m app.cli issue-token zabbix
  #   docker compose exec backend python -m app.cli issue-token solarwinds
  simulator:
    profiles: [demo]
    build:
      context: ..
      dockerfile: deploy/mocks/sources/Dockerfile
    env_file: ../.env
    environment:
      SIM_TARGET_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8080"
    networks: [internal]
