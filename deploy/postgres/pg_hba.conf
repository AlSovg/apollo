# pg_hba.conf узла БД. Подключается вместо файла по умолчанию (hba_file).
#
# Защита порта БД многослойная, этот файл — один из слоёв:
#   1. порт публикуется только на адрес оверлейной сети (DB_BIND_ADDR), не на 0.0.0.0;
#   2. ACL оверлея пускает к порту 5432 только узел приложения;
#   3. здесь: единственная БД, единственный пользователь, только scram-sha-256;
#   4. всё остальное — reject.
#
# Адрес клиента не сужается до подсети оверлея намеренно: запрос доходит до
# контейнера через docker-прокси, и Postgres видит адрес шлюза docker-сети,
# а не адрес узла приложения. Ограничение по источнику обеспечивают слои 1–2.

# Сокет внутри контейнера: healthcheck (pg_isready) и служебные операции
local   all        all                                  trust
host    all        all        127.0.0.1/32              trust

# Узел приложения. Только БД apollo и только её владелец
host    apollo     apollo     0.0.0.0/0                 scram-sha-256

# Всё прочее — отказ
host    all        all        0.0.0.0/0                 reject
host    all        all        ::/0                      reject
