# Раздача статики фронта + проксирование API на бэкенд.
# TLS, HSTS и CSP добавляются в шаге 13 (обвязка ИБ).

# Встроенный DNS Docker. Без него nginx резолвит имя апстрима один раз при
# старте и после пересоздания контейнера бэкенда держит устаревший адрес —
# на каждый деплой прилетает 502, пока nginx не перезапустят.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Имя в переменной заставляет nginx резолвить его на каждый запрос
    set $backend "backend:8000";

    root /usr/share/nginx/html;
    index index.html;

    # Контейнер слушает 8080, снаружи доступен по 80: без этого nginx
    # подставлял бы свой внутренний порт в Location и ломал переходы
    absolute_redirect off;

    # CSP без unsafe-inline и unsafe-eval. Исполняемые inline-скрипты Nuxt
    # выносятся в файлы на этапе сборки (frontend/scripts/externalize-inline.mjs),
    # поэтому политика остаётся строгой и не зависит от идентификатора сборки.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Жёсткий предел на случай явно аномального тела. Рабочий лимит приёма
    # (INGEST_MAX_BODY_BYTES, по умолчанию 1 МиБ) проверяет бэкенд — так
    # интегратор получает ошибку в формате API, а не HTML-страницу nginx.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Служебные эндпоинты живости/готовности бэкенда
    location = /health {
        proxy_pass http://$backend/health;
    }

    location = /health/ready {
        proxy_pass http://$backend/health/ready;
    }

    # SPA-fallback: ssr отключён, роутинг на клиенте.
    # $uri/index.html вместо $uri/ — иначе nginx редиректит на путь со слешем,
    # а клиентский роутер такого адреса не знает и показывает 404.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
